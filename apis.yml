name: Unwind Me
description: 'Unwind Me was a San Francisco on-demand massage startup ("Massage Made
  Simple — straight to your door, when you want, at an affordable price") that let
  customers book state-licensed, vetted massage therapists who arrived with a full
  "Unwind Kit" (table, sheets, oils). Venture-backed with Slow Ventures among its
  investors, it was acquired by rival on-demand massage platform Soothe — the transition
  notice "Unwind Me is now part of Soothe" was live on unwind.me by December 2015,
  with Soothe honoring outstanding customer credits. The company is defunct: unwind.me
  is now a parked GoDaddy domain, and it operates no website, developer portal, or
  public API surface today.'
